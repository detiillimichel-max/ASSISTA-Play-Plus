name: Coletar e moderar catálogo ASSISTA+

on:
  push:
    paths:
      - "scripts/coletar.py"
      - "moderacao/nsfwjs/**"
      - ".github/workflows/coletar.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: assista-catalog-update
  cancel-in-progress: false

jobs:
  coletar-moderar-publicar:
    name: Coletar, moderar e validar catálogo
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxe do coletor antes de executar
        run: python -m py_compile scripts/coletar.py

      - name: Guardar catálogo anterior para restauração integral
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/assista-backup"
          mkdir -p "$BACKUP_DIR"
          if [ -f catalog.json ]; then
            cp -p catalog.json "$BACKUP_DIR/catalog.json"
            echo "BACKUP_JSON=true" >> "$GITHUB_ENV"
          else
            echo "BACKUP_JSON=false" >> "$GITHUB_ENV"
          fi
          if [ -d catalog ]; then
            cp -a catalog "$BACKUP_DIR/catalog"
            echo "BACKUP_CATALOG_DIR=true" >> "$GITHUB_ENV"
          else
            echo "BACKUP_CATALOG_DIR=false" >> "$GITHUB_ENV"
          fi
          echo "BACKUP_PATH=$BACKUP_DIR" >> "$GITHUB_ENV"

      - name: Preparar Node para NSFWJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências de moderação visual
        working-directory: moderacao/nsfwjs
        run: npm install --no-audit --no-fund

      - name: Coletar candidatos (modo diagnóstico temporário)
        env:
          TARGET_CANDIDATES: "2000"
          MAX_METADATA_CHECKS: "2000"
          ENABLE_TEXT_MODERATION: "false"
          PYTHONUNBUFFERED: "1"
        run: python scripts/coletar.py

      - name: Verificar catálogo gerado antes da moderação visual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("catalog.json")
          if not path.is_file():
              raise SystemExit("ERRO: o coletor não gerou catalog.json; NSFWJS não será executado.")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"ERRO: o coletor gerou JSON inválido; NSFWJS não será executado: {exc}")
          items = data.get("items") if isinstance(data, dict) else None
          if not isinstance(items, list) or not items:
              raise SystemExit("ERRO: catálogo vazio ou campo items inválido; NSFWJS não será executado.")
          print(f"Pré-validação aprovada: {len(items)} itens no catalog.json.")
          PY

      # Moderação visual mantida no repositório, mas temporariamente ignorada para diagnosticar a chegada de conteúdo.
      - name: Moderar capas com NSFWJS (desativada temporariamente)
        if: ${{ false }}
        env:
          NSFW_CONCURRENCY: "3"
        run: node moderacao/nsfwjs/moderar-catalogo.js

      - name: Validar catálogo antes de publicar
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("catalog.json")
          if not path.is_file():
              raise SystemExit("ERRO: catalog.json não foi gerado.")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"ERRO: catalog.json inválido: {exc}")
          if not isinstance(data, dict):
              raise SystemExit("ERRO: raiz do catálogo precisa ser um objeto.")
          items = data.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("ERRO: catálogo vazio ou campo items inválido; publicação bloqueada.")

          for index, item in enumerate(items):
              if not isinstance(item, dict):
                  raise SystemExit(f"ERRO: item {index} não é um objeto.")
              if not item.get("identifier") or not item.get("title"):
                  raise SystemExit(f"ERRO: item {index} sem identifier ou title.")
              files = item.get("files")
              if not isinstance(files, list) or not files:
                  raise SystemExit(f"ERRO: item {item.get('identifier')} sem arquivos.")
              if not any(
                  isinstance(f, dict) and str(f.get("url", "")).startswith("https://archive.org/download/")
                  for f in files
              ):
                  raise SystemExit(f"ERRO: item {item.get('identifier')} sem URL reproduzível do Archive.org.")

          print(f"Catálogo validado: {len(items)} itens com metadados e arquivos.")
          PY

      - name: Restaurar catálogo anterior se qualquer etapa falhar
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="${BACKUP_PATH:-$RUNNER_TEMP/assista-backup}"
          if [ "${BACKUP_JSON:-false}" = "true" ] && [ -f "$BACKUP_DIR/catalog.json" ]; then
            cp -p "$BACKUP_DIR/catalog.json" catalog.json
          else
            rm -f catalog.json
          fi
          if [ "${BACKUP_CATALOG_DIR:-false}" = "true" ] && [ -d "$BACKUP_DIR/catalog" ]; then
            rm -rf catalog
            cp -a "$BACKUP_DIR/catalog" catalog
          elif [ "${BACKUP_CATALOG_DIR:-false}" != "true" ]; then
            rm -rf catalog
          fi
          echo "Restauração local concluída. Nenhuma publicação ocorre após falha."

      - name: Publicar somente alterações validadas
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração válida para publicar."
          else
            git commit -m "Atualiza catálogo moderado do ASSISTA+"
            git push
          fi
